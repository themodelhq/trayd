# ============================================================
# Tray'd - Docker Compose
# @description Local development and production orchestration
# ============================================================

version: '3.8'

services:
  # ----------------------------------------------------------
  # Main Application
  # ----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trayed-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/custom.db
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-nextauth-secret-change-in-production}
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - ZAI_SDK_API_KEY=${ZAI_SDK_API_KEY:-}
    volumes:
      - app_data:/app/data
      - ./db:/app/data
    restart: unless-stopped
    networks:
      - trayed-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  # PostgreSQL Database (Optional - for production)
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: trayed-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=trayed
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-trayed_secure_password}
      - POSTGRES_DB=trayed
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - trayed-network
    profiles:
      - production
      - with-db

  # ----------------------------------------------------------
  # Redis Cache (Optional - for production features)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: trayed-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - trayed-network
    profiles:
      - production
      - with-cache

# ----------------------------------------------------------
# Volumes
# ----------------------------------------------------------
volumes:
  app_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ----------------------------------------------------------
# Networks
# ----------------------------------------------------------
networks:
  trayed-network:
    driver: bridge
